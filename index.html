<!DOCTYPE html>

<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0d12">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<body>

  <symbol id="icon-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="icon-arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>

  <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 2 L20 5 L20 11 C20 16.5 16.5 20.5 12 22 C7.5 20.5 4 16.5 4 11 L4 5 Z"/></symbol>

<canvas id="bg-canvas" aria-hidden="true"></canvas>

<nav id="navbar" class="navbar">
  <div class="nav-inner">
    <a href="#home" class="nav-logo">
      <span class="nav-logo-mark"><svg class="icon"><use href="#icon-terminal"></use></svg></span>
      <span class="nav-logo-text">
        <span class="nav-logo-name" id="nav-logo-name"></span>
        <span class="nav-logo-handle" id="nav-logo-handle"></span>
      </span>
    </a>
    <div class="nav-links" id="nav-links"></div>
    <button class="nav-mobile-toggle" id="nav-mobile-toggle" aria-label="Open menu" aria-expanded="false">
      <svg class="icon"><use href="#icon-menu"></use></svg>
    </button>
  </div>
  <div class="nav-mobile-menu" id="nav-mobile-menu"></div>
</nav>

<main id="main">
  <section id="home" class="hero">
    <div class="hero-inner">
      <div class="hero-portrait-wrap">
        <img id="hero-portrait" class="hero-portrait-img" alt="">
      </div>
      <p class="hero-status"><span class="status-dot" aria-hidden="true"></span><span id="hero-status-text"></span></p>
      <p class="hero-eyebrow" id="hero-eyebrow"></p>
      <h1 class="hero-heading" id="hero-heading"></h1>
      <p class="hero-phrase-wrap"><span id="hero-phrase" class="hero-phrase"></span><span class="hero-cursor" aria-hidden="true"></span></p>
      <div class="hero-actions" id="hero-actions"></div>
    </div>
    <a href="#about" class="hero-scroll-hint">
      <span>Scroll</span>
      <svg class="icon icon-bounce"><use href="#icon-chevron-down"></use></svg>
    </a>
  </section>

  <section id="about" class="section">
    <div class="section-inner" data-reveal>
      <div class="section-header section-header--center">
        <p class="section-kicker" id="about-kicker"></p>
        <h2 class="section-heading" id="about-heading"></h2>
      </div>
      <div class="about-bio" id="about-bio"></div>
      <div class="values-grid" id="about-values"></div>
    </div>
  </section>

  <section id="skills" class="section section--alt">
    <div class="section-inner" data-reveal>
      <div class="section-header">
        <p class="section-kicker" id="skills-kicker"></p>
        <h2 class="section-heading" id="skills-heading"></h2>
      </div>
      <div class="skills-grid" id="skills-grid"></div>
    </div>
  </section>

  <section id="projects" class="section">
    <div class="section-inner" data-reveal>
      <div class="section-header section-header--split">
        <div>
          <p class="section-kicker" id="projects-kicker"></p>
          <h2 class="section-heading" id="projects-heading"></h2>
          <p class="section-sub" id="projects-sub"></p>
        </div>
        <div class="project-filters" id="project-filters"></div>
      </div>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </section>

  <section id="blog" class="section section--alt" hidden>
    <div class="section-inner" data-reveal>
      <div class="section-header">
        <p class="section-kicker">Writing</p>
        <h2 class="section-heading">Latest Posts</h2>
      </div>
      <div class="blog-grid" id="blog-grid"></div>
    </div>
  </section>

  <section id="community" class="section">
    <div class="section-inner section-inner--narrow" data-reveal>
      <div class="community-card">
        <svg class="icon icon-lg"><use href="#icon-message"></use></svg>
        <h2 class="community-heading" id="community-heading"></h2>
        <p class="community-text" id="community-text"></p>
        <a class="btn btn-primary" id="community-cta" href="#"></a>
      </div>
    </div>
  </section>

  <section id="faith" class="section section--alt">
    <div class="section-inner section-inner--narrow" data-reveal>
      <p class="section-kicker section-kicker--center" id="faith-kicker"></p>
      <div class="faith-card">
        <blockquote class="faith-quote" id="faith-verse"></blockquote>
        <p class="faith-reference" id="faith-reference"></p>
        <p class="faith-statement" id="faith-statement"></p>
      </div>
    </div>
  </section>

  <section id="terminal-section" class="section">
    <div class="section-inner section-inner--narrow" data-reveal>
      <div class="section-header section-header--center">
        <p class="section-kicker">Try It</p>
        <h2 class="section-heading">Interactive Terminal</h2>
      </div>
      <div class="terminal-window">
        <div class="terminal-header"><span id="terminal-label"></span></div>
        <div class="terminal-output" id="terminal-output" role="log" aria-live="polite"></div>
        <div class="terminal-input-row">
          <span class="terminal-prompt" id="terminal-prompt"></span>
          <label for="terminal-input" class="sr-only">Terminal command input</label>
          <input type="text" id="terminal-input" class="terminal-input" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>
  </section>

  <section id="contact" class="section section--alt">
    <div class="section-inner section-inner--narrow" data-reveal>
      <h2 class="section-heading section-heading--center" id="contact-heading"></h2>
      <p class="contact-text" id="contact-text"></p>
      <div class="contact-links" id="contact-links"></div>
      <div class="contact-email-row">
        <span id="contact-email-text"></span>
        <button id="copy-email-btn" class="copy-email-btn" data-label="Copy" type="button">Copy</button>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <p>&copy; <span id="footer-year"></span> <span id="footer-name"></span>. Made with care.</p>
</footer>

<script src="content.js"></script>

</html>
